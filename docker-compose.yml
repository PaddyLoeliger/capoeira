services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: roda
      POSTGRES_PASSWORD: roda
      POSTGRES_DB: caderno
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roda -d caderno"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    ports:
      - "3847:3847"
    environment:
      DATABASE_URL: postgresql://roda:roda@db:5432/caderno
      ARCHIVE_DIR: /app/data
      PORT: "3847"
      HOST: 0.0.0.0
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
    command: ["bash", "/app/docker/entrypoint.sh"]

volumes:
  pgdata:
  app_node_modules:
